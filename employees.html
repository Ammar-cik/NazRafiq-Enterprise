<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees - NazRafiq Enterprise</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Inter', sans-serif;
    transition: 0.3s;
}
body.dark {
    background-color: #1e1e1e;
    color: white;
}
.navbar.dark {
    background-color: #212529 !important;
}
.table-dark thead th {
    background-color: #212529;
    color: white;
}
.card {
    border-radius: 12px;
    transition: 0.3s;
}
.dark .card {
    background-color: #292929 !important;
    color: white !important;
}
.action-icons i {
    cursor: pointer;
    font-size: 1.2rem;
    margin-right: 10px;
}
.action-icons i:hover {
    color: #dc3545;
}

/* Mobile Responsive */
@media (max-width: 576px) {
    .navbar-brand {
        font-size: 1.2rem !important;
    }
    #searchInput, #departmentFilter {
        margin-bottom: 10px;
    }
}


body {
    min-height: 100vh;
    width: 100%;
    margin: 0;
    padding: 0;

    /* Background image */
    background-image: url('employees.jpg');
    background-size: cover;       /* stretch to cover whole page */
    background-position: center;  /* center the image */
    background-repeat: no-repeat; /* no tiling */
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4); /* adjust opacity as needed */
    z-index: -1;
}


body.dark {
    background-image: 
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('employees.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;
}


</style>
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-3 d-flex align-items-center mx-auto" href="#">
      <i class="bi bi-building me-2" style="font-size: 1.5rem;"></i>
      NazRafiq Enterprise
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold" href="employees.html">Employees</a></li>
        <li class="nav-item"><a class="nav-link" href="departments.html">Departments</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
        <li class="nav-item ms-3">
          <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h2 class="mb-2"><i class="bi bi-people-fill me-2"></i>Employees</h2>
        <button class="btn btn-dark" id="darkToggle">
            <i class="bi bi-moon-stars"></i> Dark Mode
        </button>
    </div>

    <!-- Search + Filter -->
    <div class="row mb-4 mt-3">
        <div class="col-md-6 col-sm-12 mb-2">
            <input id="searchInput" type="text" class="form-control" placeholder="Search employee name...">
        </div>
        <div class="col-md-6 col-sm-12 mb-2">
            <select id="departmentFilter" class="form-select">
                <option value="">Filter by department</option>
                <option>IT</option>
                <option>HR</option>
                <option>Finance</option>
                <option>Marketing</option>
                <option>Sales</option>
                <option>Customer Service</option>
            </select>
        </div>
    </div>

    <!-- Employees Table -->
    <div class="card p-4 shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered" id="employeeTable">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th><i class="bi bi-person-circle me-1"></i>Name</th>
                        <th><i class="bi bi-briefcase-fill me-1"></i>Position</th>
                        <th><i class="bi bi-building me-1"></i>Department</th>
                        <th><i class="bi bi-trash-fill"></i></th>
                    </tr>
                </thead>
                <tbody id="employeeBody"></tbody>
            </table>
        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Sample Employees Data
const employees = [
    {name:"John Samuel",position:"IT Technician",department:"IT"},
    {name:"Amira Hasan",position:"HR Executive",department:"HR"},
    {name:"Daniel Lee",position:"Accountant",department:"Finance"},
    {name:"Sofia Lim",position:"Marketing Analyst",department:"Marketing"},
    {name:"Farhana Aziz",position:"Software Developer",department:"IT"},
    {name:"Michael Chan",position:"Sales Manager",department:"Sales"},
    {name:"Lily Wong",position:"Customer Support",department:"Customer Service"},
    {name:"Arif Rahman",position:"Network Engineer",department:"IT"},
    {name:"Nur Aisyah",position:"Recruitment Officer",department:"HR"},
    {name:"Jason Yap",position:"Finance Assistant",department:"Finance"},
    {name:"Carmen Lau",position:"Brand Strategist",department:"Marketing"},
    {name:"Hafiz Zain",position:"Software Tester",department:"IT"},
    {name:"Elaine Goh",position:"Payroll Officer",department:"HR"},
    {name:"Victor Tan",position:"Sales Executive",department:"Sales"},
    {name:"Nadia Karim",position:"Customer Care Agent",department:"Customer Service"},
    {name:"Adam Lee",position:"Full Stack Developer",department:"IT"},
    {name:"Queensy Tan",position:"Creative Designer",department:"Marketing"},
    {name:"Rayyan Saad",position:"Finance Auditor",department:"Finance"},
    {name:"Sarah Lim",position:"HR Intern",department:"HR"},
    {name:"Irfan Malik",position:"IT Support",department:"IT"},
    {name:"Rachel Ho",position:"Business Analyst",department:"Finance"},
    {name:"Mira Zulkifli",position:"Digital Marketer",department:"Marketing"},
    {name:"Jordan Ng",position:"Sales Consultant",department:"Sales"},
    {name:"Hannah Ong",position:"Customer Advisor",department:"Customer Service"},
    {name:"Lucas Wong",position:"System Developer",department:"IT"}
];

// Render Employees
function renderEmployees() {
    const tbody = document.getElementById("employeeBody");
    tbody.innerHTML = "";

    const search = document.getElementById("searchInput").value.toLowerCase();
    const filter = document.getElementById("departmentFilter").value;

    const filtered = employees.filter(emp =>
        emp.name.toLowerCase().includes(search) &&
        (filter === "" || emp.department === filter)
    );

    filtered.forEach((emp, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${emp.name}</td>
                <td>${emp.position}</td>
                <td>${emp.department}</td>
                <td class="text-center">
                    <i class="bi bi-trash-fill text-danger"></i>
                </td>
            </tr>
        `;
    });
}

// Event Listeners
document.getElementById("searchInput").addEventListener("input", renderEmployees);
document.getElementById("departmentFilter").addEventListener("change", renderEmployees);

// Initial Render
renderEmployees();

// Dark Mode Toggle
document.getElementById("darkToggle").addEventListener("click", () => {
    document.body.classList.toggle("dark");
});
</script>

</body>
</html>
