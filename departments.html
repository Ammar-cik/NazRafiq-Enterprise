<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments - NazRafiq Enterprise</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body.dark {
    background-color: #1e1e1e;
    color: white;
}

/* Department Grid */
.dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.dept-card {
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    transition: 0.4s;
    color: white;
    min-height: 180px;
}

.dept-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

.dept-icon {
    font-size: 3rem;
}

.kpi-card {
    border-radius: 12px;
}

.dark .dept-card {
    opacity: 0.85;
}

.dark .kpi-card {
    background-color: #292929 !important;
    color: white !important;
}

/* ============================
   MOBILE RESPONSIVE FIXES
   ============================ */
@media (max-width: 576px) {
    .navbar-brand {
        font-size: 1.2rem !important;
    }
    .kpi-card h2 {
        font-size: 1.4rem;
    }
    .dept-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .dept-card {
        padding: 18px;
        min-height: 150px;
    }
    .dept-icon {
        font-size: 2.4rem;
    }
    .container {
        padding-left: 10px;
        padding-right: 10px;
    }
    #deptChart {
        max-height: 260px;
    }
    .modal-dialog {
        max-width: 95% !important;
    }
}

body {
    min-height: 100vh;
    width: 100%;
    margin: 0;
    padding: 0;

    /* Background image */
    background-image: url('work.jpg');
    background-size: cover;       /* stretch to cover whole page */
    background-position: center;  /* center the image */
    background-repeat: no-repeat; /* no tiling */
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4); /* adjust opacity as needed */
    z-index: -1;
}


body.dark {
    background-image: 
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('work.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;
}

</style>
</head>

<body class="bg-light">


    
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-3 d-flex align-items-center mx-auto" href="#">
      <i class="bi bi-building me-2" style="font-size: 1.5rem;"></i>
      NazRafiq Enterprise
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="employees.html">Employees</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold" href="departments.html">Departments</a></li>
        <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
      </ul>
      <form class="d-flex ms-3">
        <button type="button" class="btn btn-outline-light" onclick="logout()">Logout</button>
      </form>
    </div>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h2 class="mb-2"><i class="bi bi-building me-2"></i>Department Overview</h2>
        <button class="btn btn-dark" id="darkToggle">
            <i class="bi bi-moon-stars"></i> Dark Mode
        </button>
    </div>

    <!-- KPI Cards -->
    <div class="row g-3 mb-4">

        <div class="col-md-4 col-sm-6">
            <div class="card p-3 shadow-sm kpi-card">
                <h5>Total Departments</h5>
                <h2 id="kpiDepartments" class="fw-bold"></h2>
            </div>
        </div>

        <div class="col-md-4 col-sm-6">
            <div class="card p-3 shadow-sm kpi-card">
                <h5>Employees Total</h5>
                <h2 id="kpiEmployees" class="fw-bold"></h2>
            </div>
        </div>

        <div class="col-md-4 col-sm-12">
            <div class="card p-3 shadow-sm kpi-card">
                <h5>Most Staff</h5>
                <h2 id="kpiTopDept" class="fw-bold"></h2>
            </div>
        </div>

    </div>

    <!-- Chart -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="mb-3"><i class="bi bi-bar-chart-fill me-2"></i>Employees by Department</h5>
            <canvas id="deptChart"></canvas>
        </div>
    </div>

    <!-- Department Grid -->
    <div class="dept-grid" id="deptGrid"></div>

</div>

<!-- Department Modal -->
<div class="modal fade" id="deptModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 id="modalTitle" class="fw-bold"></h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <h6 class="fw-bold">Employees:</h6>
                <ul id="modalList" class="list-group"></ul>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Script.js -->
<script src="script.js"></script>

<script>
// COLORS FOR GRID
const bgColors = {
    "IT": "#0d6efd",
    "HR": "#ffc107",
    "Finance": "#198754",
    "Marketing": "#0dcaf0",
    "Sales": "#dc3545",
    "Customer Service": "#6c757d"
};

// ICONS
const icons = {
    "IT": "bi-pc-display",
    "HR": "bi-people-fill",
    "Finance": "bi-cash-coin",
    "Marketing": "bi-megaphone-fill",
    "Sales": "bi-bag-fill",
    "Customer Service": "bi-headset"
};

// ==========================
// KPI SECTION
// ==========================
document.getElementById("kpiDepartments").innerText = Object.keys(departmentSummary).length;
document.getElementById("kpiEmployees").innerText = employees.length;

let topDept = Object.keys(departmentSummary)
    .reduce((a, b) => departmentSummary[a] > departmentSummary[b] ? a : b);

document.getElementById("kpiTopDept").innerText = topDept;

// ==========================
// Render Department Grid
// ==========================
const grid = document.getElementById("deptGrid");

departments.forEach(d => {
    grid.innerHTML += `
        <div class="dept-card" 
            style="background:${bgColors[d.name]};"
            onclick="openDept('${d.name}')">

            <i class="bi ${icons[d.name]} dept-icon mb-2"></i>
            <h4>${d.name}</h4>
            <p>${d.staff} Employees</p>
        </div>
    `;
});

// ==========================
// Modal Logic
// ==========================
function openDept(deptName) {
    document.getElementById("modalTitle").innerText = deptName;

    const list = document.getElementById("modalList");
    list.innerHTML = "";

    const filtered = employees.filter(e => e.department === deptName);

    filtered.forEach(emp => {
        list.innerHTML += `
            <li class="list-group-item">
                <strong>${emp.name}</strong> — ${emp.position}
            </li>
        `;
    });

    new bootstrap.Modal(document.getElementById("deptModal")).show();
}

// ==========================
// Dark Mode Toggle
// ==========================
document.getElementById("darkToggle").addEventListener("click", () => {
    document.body.classList.toggle("dark");
});
</script>

</body>
</html>
